<!DOCTYPE html>
<html>
    <head>
    <title>facebook</title>

    <style>
        
          body{
            background-color: whitesmoke;
          }  
.container{
    box-sizing: border-box;
    background-color:white;
    padding:20px 20px 40px 20px;
    border-radius: 8px;
    margin:auto;
    width:30%;
    box-shadow: 3px 3px 3px rgb(224, 219, 219);

}
h1{
    color: blue;
    text-align: center;
    font-size:40px ;
}
input{
    padding:10px;
    width: 95%;
border-radius: 9px;
    border:1px solid lightgray;
    margin:0px 0px 10px 0px;

}
button{
    background-color: blue;
    width: 100%;
    padding: 10px;
    border-radius: 9px;

    color:white;
    margin: 0px 0px 10px 0px;
}

    a{
        margin-left: 10px;
    }
}

        </head>
        <body>
            
            <h1>facebook</h1>
            <div class="container">

            <input type="text" placeholder="Email address or phone number"/><br>
     
            <input type="text" placeholder="password"/>
            <button >Log in</button>
            <div class="anchor">
            <a href="https://www.facebook.com/">Forgotten account?</a>   <a href="https://www.facebook.com/">Sign up for Facebook</a>
</div>
</div>
